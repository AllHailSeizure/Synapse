name: bandaids

# Reusable workflow. Target repos call this from a stub — see
# automations/claude/stub.yml. All bandaid logic lives here so a change lands
# in every repo at once.

on:
  workflow_call:
    inputs:
      setup:
        description: >-
          Bash run by every bandaid job before Claude starts. The runner is
          bare, so whatever this repo's .synapse/bandaids.md Verify and Repro commands
          invoke has to be installed here. Export variables those commands
          reference by appending to $GITHUB_ENV.
        type: string
        required: false
        default: ""
      debug:
        description: >-
          Unhide the Claude SDK output in the job log. Diagnostic only — the
          log becomes public to anyone who can read the repo's Actions runs.
        type: boolean
        required: false
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  MARKETPLACE: https://github.com/AllHailSeizure/Synapse.git
  # No track_progress: it buries `prompt` in the action's own template as
  # <custom_instructions>, so the slash command is never expanded and the
  # bandaid skill never loads. The skills comment on the issue themselves.
  # allowedTools has to be stated: the action's default set is read-only plus
  # git, which cannot apply a fix or run a repo's verify commands.
  # Sonnet, not Opus: bandaids are bounded mechanical jobs, and these runs
  # spend the same subscription window as interactive work.
  CLAUDE_ARGS: |
    --model claude-sonnet-5
    --max-turns 60
    --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
    --disallowedTools "Task,WebSearch,WebFetch"

jobs:
  bug:
    name: bug-bandaid
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@bug-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bug-bandaid-${{ github.repository }}-${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repo setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:bug-bandaid ${{ github.event.issue.number }}"
          show_full_output: ${{ inputs.debug }}
          claude_args: ${{ env.CLAUDE_ARGS }}

  merge:
    name: merge-bandaid
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@merge-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: merge-bandaid-${{ github.repository }}-${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repo setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:merge-bandaid ${{ github.event.issue.number }}"
          show_full_output: ${{ inputs.debug }}
          claude_args: ${{ env.CLAUDE_ARGS }}

  ci:
    name: ci-bandaid
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@ci-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-bandaid-${{ github.repository }}-${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repo setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:ci-bandaid ${{ github.event.issue.number }}"
          show_full_output: ${{ inputs.debug }}
          claude_args: ${{ env.CLAUDE_ARGS }}

  review:
    name: review-bandaid
    if: >-
      github.event_name == 'pull_request_review_comment' &&
      contains(github.event.comment.body, '@review-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: review-bandaid-${{ github.repository }}-${{ github.event.comment.id }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repo setup
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:review-bandaid ${{ github.event.pull_request.number }} ${{ github.event.comment.id }}"
          show_full_output: ${{ inputs.debug }}
          claude_args: ${{ env.CLAUDE_ARGS }}
