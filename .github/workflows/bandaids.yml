name: bandaids

# Reusable workflow. Target repos call this from a stub — see
# automations/claude/stub.yml. All bandaid logic lives here so a change lands
# in every repo at once.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  MARKETPLACE: https://github.com/AllHailSeizure/synapse.git
  CLAUDE_ARGS: |
    --model claude-opus-5
    --max-turns 60
    --disallowedTools "Task,WebSearch,WebFetch"

jobs:
  bug:
    name: bug-bandaid
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@bug-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: bug-bandaid-${{ github.repository }}-${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:bug-bandaid ${{ github.event.issue.number }}"
          track_progress: true
          claude_args: ${{ env.CLAUDE_ARGS }}

  merge:
    name: merge-bandaid
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@merge-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: merge-bandaid-${{ github.repository }}-${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:merge-bandaid ${{ github.event.issue.number }}"
          track_progress: true
          claude_args: ${{ env.CLAUDE_ARGS }}

  review:
    name: review-bandaid
    if: >-
      github.event_name == 'pull_request_review_comment' &&
      contains(github.event.comment.body, '@review-bandaid')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: review-bandaid-${{ github.repository }}-${{ github.event.comment.id }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ env.MARKETPLACE }}
          plugins: synapse@synapse
          prompt: "/synapse:review-bandaid ${{ github.event.pull_request.number }} ${{ github.event.comment.id }}"
          track_progress: true
          claude_args: ${{ env.CLAUDE_ARGS }}
