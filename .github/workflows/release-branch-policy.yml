name: Release branch policy

on:
  pull_request:
    branches: [claude-release, codex-release]

jobs:
  release-branch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths
        shell: pwsh
        run: |
          $range = "origin/${{ github.base_ref }}...${{ github.sha }}"
          $paths = @(git diff --name-only --diff-filter=ACMRT $range)
          $removed = @(git diff --name-only --diff-filter=D $range)
          ./.github/scripts/Test-ReleaseBranchPolicy.ps1 -TargetBranch "${{ github.base_ref }}" -ChangedPath $paths -RemovedPath $removed
      - name: Validate Codex manifest
        if: github.base_ref == 'codex-release'
        shell: pwsh
        run: ./.github/scripts/Validate-CodexPlugin.ps1
