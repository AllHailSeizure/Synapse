[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weedeat"
version = "0.1.0"
description = "Deterministic worktree cleanup scanner and interactive review app"
requires-python = ">=3.10"
dependencies = ["textual"]

[project.scripts]
weedeat = "apps.weedeat.cli:main"

[tool.setuptools]
packages = ["apps.weedeat"]
package-dir = { "apps.weedeat" = "." }
