# Copy to .github/workflows/bandaids.yml in any repo that should run bandaids.
# Identical in every repo — all logic lives in the reusable workflow.
name: bandaids

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  bandaid:
    uses: AllHailSeizure/Synapse/.github/workflows/bandaids.yml@master
    secrets: inherit
