# Copy to .github/workflows/bandaids.yml in any repo that should run bandaids.
# All logic lives in the reusable workflow; the only per-repo part is `setup`,
# which installs whatever this repo's SYNAPSE.md Verify and Repro commands need.
name: bandaids

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  bandaid:
    # A called workflow's jobs can only hold permissions the caller already has,
    # so these must be granted here even when the repo default is read/write —
    # id-token is never in the default set.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    uses: AllHailSeizure/Synapse/.github/workflows/bandaids.yml@master
    secrets: inherit
    # with:
    #   setup: |
    #     echo "SOME_TOOL=$GITHUB_WORKSPACE/.bin/tool" >> "$GITHUB_ENV"
    #   debug: true   # unhide Claude's output in the job log while diagnosing
