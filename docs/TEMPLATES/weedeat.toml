# .synapse/weedeat.toml — repo manifest template for the /weedeat skills
#
# Copy this to `.synapse/weedeat.toml` in the root of any repo that runs
# `asset-churn-audit` or `worktree-cleanup`, keep the keys that apply, and
# delete the rest. Every key is optional; an absent file means both skills run
# on their generic defaults, which is correct but blunt.
#
# It is deliberately not SYNAPSE.md. SYNAPSE.md is the flat key:value manifest
# the bandaids read at Gate 0 — commands to run, paths not to touch. This is
# structured data for two read-only survey scripts, and it is the only place
# repo-specific knowledge belongs: the skills themselves stay generic, so
# anything that names your engine, your tooling, or your directory layout
# goes here.
#
# The one value shared with SYNAPSE.md is the default branch. Leave
# `[assets] base` unset and the audit reads `base:` out of SYNAPSE.md rather
# than making you keep two copies in sync.

# ---------------------------------------------------------------------------
# asset-churn-audit — which files count as assets, and how to prove one moved
# ---------------------------------------------------------------------------

[assets]

# Baseline the branch diff is taken against. Resolution order:
#   --base flag  ->  this key  ->  origin/<SYNAPSE.md base>  ->  origin/HEAD
# Prefer a remote ref. Local master is often several merged PRs behind, which
# makes already-landed assets look like new changes in your branch.
base = "origin/master"

# Extensions the audit classifies. Anything not listed here is ignored, so a
# repo whose assets are .glb and .fbx must say so.
art = [".png", ".jpg", ".jpeg", ".aseprite", ".pxo"]
audio = [".ogg", ".wav", ".mp3", ".aup3"]

# Generated companion files: not authored content, but often mandatory next to
# a new asset. Judged by what they belong to — `sprite.png.import` pairs with
# `sprite.png` by stripping the final suffix.
sidecar = [".import", ".uid"]

# Files that can legitimately reference an asset. The audit greps these for a
# pointer at each changed asset; an asset nothing changed points at is the
# classic churn signature. Omit to search every tracked file, which is slower
# and noisier but works anywhere.
reference_globs = ["*.tscn", "*.tres", "*.gd", "*.godot"]

# How references spell an in-repo asset path. Godot writes `res://art/x.png`;
# a web project may write `/static/x.png` or nothing at all. The repo-relative
# path is always searched in addition to this.
resource_prefix = "res://"

# Format-specific evidence, opt-in by name. Without these the audit falls back
# to reference-scanning alone, which is honest but much blunter.
#
#   godot-import    a .import diff that only moves .godot/imported/ cache
#                   hashes is machine-local churn; a uid= change is not
#   pixelorama-pxo  a .pxo is a zip — hash image_data/* separately from
#                   data.json to tell a real pixel edit from a bare re-save
analyzers = ["godot-import", "pixelorama-pxo"]

# Blanket verdicts for a whole extension, applied before any other evidence.
# For files whose presence in a feature branch is the problem regardless of
# what changed inside them. Repeat the block per extension.
[[assets.flag]]
ext = ".aup3"
verdict = "REVIEW"
reason = """Audacity source project (LFS, ~100MB) — the recording session, not \
a game asset; the game never loads one. Belongs on an audio branch unless this \
PR is specifically about audio production."""

# ---------------------------------------------------------------------------
# worktree-cleanup — where worktrees live and what "dirty" actually means
# ---------------------------------------------------------------------------

[worktrees]

# Directories this repo creates worktrees under, relative to the repo root.
# Scanned for orphans: full checkouts on disk that git no longer registers.
containers = [".claude/worktrees", ".worktrees"]

# Path fragments marking a worktree another tool owns and may be mid-session
# in. Reported, never proposed for removal.
foreign_markers = [".cursor", ".codex", ".vscode"]

# Uncommitted paths that carry no work. Without these, a repo whose engine
# rewrites sidecars on every editor open reports every worktree as unsafe and
# the survey stops meaning anything.
noise_suffixes = [".import", ".uid"]
noise_dirs = [".godot/", ".worktrees/", ".claude/worktrees/"]

# Branches never proposed for deletion, beyond the checked-out ones.
# Defaults to master and main.
protected_branches = ["master", "main"]
